name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync (with dev extras)
        run: uv sync --extra dev
      - name: Lint
        run: uvx ruff check opentine_gui tests demo
      - name: Test (headless — no Dear PyGui viewport)
        run: uv run pytest -q
      - name: Verify bundled .tine fixtures load under released opentine
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from opentine.core import Run
          for f in sorted(Path(".tine_runs").glob("*.tine")):
              Run.load(f)
              assert Run.verify_integrity(f).ok, f
              print("ok", f.name)
          PY
