name: Release

# Publishes to PyPI when a v* tag is pushed, using PyPI Trusted Publishing
# (OIDC). No API token is stored in this repository.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI Project Name: opentine-gui
#   Owner:             0xcircuitbreaker
#   Repository name:   opentine-gui
#   Workflow name:     publish.yml
#   Environment name:  pypi
#
# opentine-gui is not on PyPI yet, so this must be added as a *pending*
# publisher (the "Add a new pending publisher" form), not from a project page.
# Trusted Publishing is per project: the publisher on opentine-tui does not
# authorise uploads for opentine-gui.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Fail if the tag does not match the packaged version
        # A tag that disagrees with pyproject would publish the wrong version
        # under the right name, which cannot be undone on PyPI.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run --no-project --with tomli python -c \
            "import tomli;print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG packaged=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != version $PKG"; exit 1; }

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/tine-gui --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token Trusted Publishing exchanges for an upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach the distribution to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
