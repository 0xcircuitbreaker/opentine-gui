[project]
name = "opentine-gui"
version = "0.3.0"
description = "Desktop GUI for opentine — browse, inspect, compare and fork agent runs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "CircuitBreaker", email = "44181392+0xcircuitbreaker@users.noreply.github.com" },
]
maintainers = [
    { name = "CircuitBreaker", email = "44181392+0xcircuitbreaker@users.noreply.github.com" },
]
requires-python = ">=3.11"
keywords = ["opentine", "agent", "llm", "observability", "tracing", "gui", "dearpygui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
dependencies = [
    # 0.7.1 is the correctness floor, not a preference. Below it opentine cannot
    # read a `causal_ids` step field (so every console write erases the causal
    # edges a v3-derived run carries) and cannot verify a `tine-sig/2`
    # signature (so a valid signature is reported as an error, which reads as
    # tampering). 0.7.2 additionally round-trips cost and billing through
    # OpenTelemetry and ships the source-confirmed 75-card pricing catalog, both
    # of which the import and pricing panels depend on being honest.
    "opentine>=0.7.2,<0.9",
    "dearpygui>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/opentine-gui"
Repository = "https://github.com/0xcircuitbreaker/opentine-gui"
Issues = "https://github.com/0xcircuitbreaker/opentine-gui/issues"
Changelog = "https://github.com/0xcircuitbreaker/opentine-gui/blob/main/CHANGELOG.md"
"opentine (the library)" = "https://github.com/0xcircuitbreaker/opentine"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
tine-gui = "opentine_gui:main"

# On Windows a console script keeps a terminal window open behind the GUI for
# the process's lifetime; a gui-script is launched by pythonw.exe instead.
[project.gui-scripts]
tine-gui-w = "opentine_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
