[project]
name = "opentine-gui"
version = "0.1.0"
description = "Desktop GUI for opentine — visual management console built with Dear PyGui"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "opentine>=0.1.1",
    "dearpygui>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
tine-gui = "opentine_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
