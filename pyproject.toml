[project]
name = "opentine-gui"
version = "0.2.0"
description = "Desktop GUI for opentine — browse, inspect, compare and fork agent runs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["opentine", "agent", "llm", "observability", "tracing", "gui", "dearpygui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
dependencies = [
    # 0.4.0 makes a fork id identify the fork act, so forking the same step twice
    # yields distinct runs. Below that, the GUI's fork action silently overwrites
    # the previous fork of the same point. That is the real floor; 0.5.0 is
    # additive over it and is what this release is tested against.
    "opentine>=0.4.0",
    "dearpygui>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/opentine-gui"
Repository = "https://github.com/0xcircuitbreaker/opentine-gui"
Issues = "https://github.com/0xcircuitbreaker/opentine-gui/issues"
Changelog = "https://github.com/0xcircuitbreaker/opentine-gui/blob/main/CHANGELOG.md"
"opentine (the library)" = "https://github.com/0xcircuitbreaker/opentine"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
tine-gui = "opentine_gui:main"

# On Windows a console script keeps a terminal window open behind the GUI for
# the process's lifetime; a gui-script is launched by pythonw.exe instead.
[project.gui-scripts]
tine-gui-w = "opentine_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
