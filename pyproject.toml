[project]
name = "opentine-gui"
version = "0.3.0"
description = "Desktop GUI for opentine — browse, inspect, compare and fork agent runs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "CircuitBreaker", email = "44181392+0xcircuitbreaker@users.noreply.github.com" },
]
maintainers = [
    { name = "CircuitBreaker", email = "44181392+0xcircuitbreaker@users.noreply.github.com" },
]
requires-python = ">=3.11"
keywords = ["opentine", "agent", "llm", "observability", "tracing", "gui", "dearpygui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
dependencies = [
    # The floor is a correctness line, not a preference. Each release below it
    # is missing a field this console reads and writes back, and opentine's
    # reader ignores keys it does not know — so an older library loads a newer
    # artifact, drops the field in memory, and destroys it on disk the moment
    # the console saves:
    #   0.7.1  `causal_ids`, the edges a fork actually follows
    #   0.8.0  `provider`, half of the (provider, model, usage) record that
    #          post-hoc pricing is a function of
    # 0.8.0 is also what makes `tine price`, time-of-day rate cards and the
    # unmetered local servers readable at all, which is most of what the cost
    # panels say.
    "opentine>=0.8.0,<0.9",
    "dearpygui>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/opentine-gui"
Repository = "https://github.com/0xcircuitbreaker/opentine-gui"
Issues = "https://github.com/0xcircuitbreaker/opentine-gui/issues"
Changelog = "https://github.com/0xcircuitbreaker/opentine-gui/blob/main/CHANGELOG.md"
"opentine (the library)" = "https://github.com/0xcircuitbreaker/opentine"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
tine-gui = "opentine_gui:main"

# On Windows a console script keeps a terminal window open behind the GUI for
# the process's lifetime; a gui-script is launched by pythonw.exe instead.
[project.gui-scripts]
tine-gui-w = "opentine_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
